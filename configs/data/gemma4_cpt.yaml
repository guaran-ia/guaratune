output_dir: data
tokenizer: google/gemma-4-E4B
seed: 20260721

split_config: data/kuatia_config.yaml

sources:
  kuatia:
    name: kuatia
    dataset: guaran-ia/kuatia
    version: compiled_full
    loader: datasets
    requested_revision: null
    commit_id: 5045d1bd67d2ea6d40d9c2a30d109ddc0a508a94
    selection_path: data/selections/kuatia.selection.jsonl.gz

  fineweb_edu_es:
    name: fineweb_edu_es
    dataset: Helsinki-NLP/fineweb-edu-translated
    version: spa
    loader: hf_parquet
    requested_revision: null
    commit_id: d82b075a4a8152727b232876aade2ade003e12b9
    selection_path: data/selections/fineweb_edu_es20.selection.jsonl.gz

  fineweb_edu_en:
    name: fineweb_edu_en
    dataset: HuggingFaceFW/fineweb-edu
    version: null
    loader: datasets
    requested_revision: null
    commit_id: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
    selection_path: data/selections/fineweb_edu_en20.selection.jsonl.gz

corpora:
  C1_kuatia:
    kuatia:
      include_synthetic: true
    augmentations: []

  C2_kuatia_no_synthetic:
    kuatia:
      include_synthetic: false
    augmentations: []

  C3_kuatia_es20:
    kuatia:
      include_synthetic: true
    augmentations:
      - source: fineweb_edu_es
        ratio: 0.2
        ratio_reference: C1_kuatia
        train_selection_path: data/selections/C3_kuatia_es20.fineweb_edu_es.train.selection.jsonl.gz
        validation_selection_path: data/selections/C3_kuatia_es20.fineweb_edu_es.validation.selection.jsonl.gz

