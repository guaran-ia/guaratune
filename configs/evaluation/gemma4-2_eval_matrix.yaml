generated_config_dir: configs/evaluation/generated
outputs_root: outputs/evaluation
task_include_path: evaluation/lm_eval_tasks
training_outputs_root: outputs/train/gemma4_2b/experiments
seed: 20260721

model:
  key: gemma4_2b
  model_name_or_path: google/gemma-4-E2B
  model_revision: main
  trust_remote_code: false
  dtype: bfloat16
  device: cuda:0
  batch_size: auto
  max_batch_size: 12

defaults:
  env_file: .env
  cache_path: outputs/evaluation/cache/requests
  model: hf
  num_fewshot: null
  cache_requests: true
  log_samples: false
  include_instruction_tasks: false
  limit: null

suites:
  global_mmlu_lite:
    tasks:
      - guarani_global_mmlu_lite
      - english_global_mmlu_lite
      - spanish_global_mmlu_lite
    task_overrides:
      guarani_global_mmlu_lite:
        metrics: [acc]
        num_fewshot: 5
        fewshot_split: dev
      english_global_mmlu_lite:
        metrics: [acc]
        num_fewshot: 5
        fewshot_split: dev
      spanish_global_mmlu_lite:
        metrics: [acc]
        num_fewshot: 5
        fewshot_split: dev
    log_samples: true

  belebele:
    tasks:
      - guarani_2m_belebele
      - english_2m_belebele
      - spanish_2m_belebele
    task_overrides:
      guarani_2m_belebele:
        metrics: [acc]
        num_fewshot: 1
        fewshot_split: test
      english_2m_belebele:
        metrics: [acc]
        num_fewshot: 1
        fewshot_split: test
      spanish_2m_belebele:
