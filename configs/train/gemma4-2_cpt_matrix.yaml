generated_config_dir: configs/train/generated
runs_root: outputs/train/gemma4_2b

reporting:
  report_to: wandb
  wandb_project: guarania-models-cpt
  wandb_run_group: gemma4_2b
  wandb_mode: online
  wandb_tags: gemma4,cpt,guarani,text-only

model:
  key: gemma4_2b
  model_name_or_path: google/gemma-4-E2B
  model_revision: main
  trust_remote_code: true
  cutoff_len: 2048

defaults:
  common:
    stage: pt
    do_train: true
    dataset_dir: data
    preprocessing_num_workers: 16
    dataloader_num_workers: 4
    packing: true
    flash_attn: sdpa
    disable_gradient_checkpointing: false
    plot_loss: true
    overwrite_output_dir: false
    save_only_model: false
    report_to: wandb
    logging_steps: 10
    save_steps: 500
    save_total_limit: 3
    per_device_train_batch_size: 1
    optim: adamw_torch
    adam_beta1: 0.9
    adam_beta2: 0.999
    learning_rate: 2.0e-5
    lr_scheduler_type: cosine_with_min_lr
    lr_scheduler_kwargs:
      min_lr: 2.0e-6
    warmup_steps: 0.03
    max_grad_norm: 1.0
    num_train_epochs: 4.0
    bf16: true
    ddp_timeout: 180000000
    resume_from_checkpoint: null
    do_eval: true
    eval_strategy: epoch
    eval_steps: 500
    per_device_eval_batch_size: 1
    eval_accumulation_steps: 1

  full:
    finetuning_type: full
    pure_bf16: true
    gradient_accumulation_steps: 32
    weight_decay: 0.01

  lora:
    finetuning_type: lora
    lora_target: all
    lora_dropout: 0.05
    lora_alpha_multiplier: 2
    gradient_accumulation_steps: 8

profiles:
  smoke:
    methods:
      - lora
    corpora:
      - C1_kuatia
    lora_ranks:
      - 64
    overrides:
      max_steps: 5
      logging_steps: 1
      save_steps: 5
      overwrite_output_dir: true

  experiments:
    methods:
      - full
      - lora
    corpora:
      - C1_kuatia
      - C2_kuatia_no_synthetic
      - C3_kuatia_es20
      - C4_kuatia_no_synthetic_es20
      - C5_kuatia_en20
      - C6_kuatia_no_synthetic_en20
      - C7_kuatia_es10_en10
      - C8_kuatia_no_synthetic_es10_en10
    lora_ranks:
      - 64
      - 128
      - 256
      - 512
