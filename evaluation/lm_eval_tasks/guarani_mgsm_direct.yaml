task: guarani_mgsm_direct
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    train: data/evaluation/mgsm/mgsm_train_english2gug_microsoft_translated.jsonl
    test: data/evaluation/mgsm/mgsm_test_english2gug_microsoft_translated.jsonl
test_split: test
training_split: train
output_type: generate_until
target_delimiter: ""
doc_to_text: '{% if answer is not none %}{{question+"\nMbohovái:"}}{% else %}{{"Porandu: "+question+"\nMbohovái:"}}{% endif %}'
doc_to_target: '{% if answer is not none %}{{answer[19:]}}{% else %}{{answer_number|string}}{% endif %}'
generation_kwargs:
  until:
    - 'Porandu:'
    - </s>
    - <|im_end|>
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
  - name: flexible-extract
    filter:
      - function: regex
        group_select: -1
        regex_pattern: (-?[$0-9.,]{2,})|(-?[0-9]+)
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
