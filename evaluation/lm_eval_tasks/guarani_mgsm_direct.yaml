task: guarani_mgsm_direct
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    train: data/evaluation/mgsm/mgsm-gn-train.jsonl
    test: data/evaluation/mgsm/mgsm-gn-test.jsonl
test_split: test
training_split: train
output_type: generate_until
target_delimiter: ""
doc_to_text: "{{question.strip()}}\nMbohovái:"
doc_to_target: "{{answer_number|string}}"
generation_kwargs:
  until:
    - "\n"
    - "\n\n"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
filter_list:
  - name: flexible-extract
    filter:
      - function: regex
        group_select: -1
        regex_pattern: (-?[$0-9.,]{2,})|(-?[0-9]+)
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
