task: guarani_2m_belebele
dataset_path: facebook/2M-Belebele
dataset_name: grn_Latn
test_split: test
fewshot_split: test
output_type: multiple_choice
should_decontaminate: true
doc_to_decontamination_query: "{{question}}"
process_docs: !function utils.process_2m_belebele_docs
doc_to_text: "{{flores_passage}}\n\n{{question.strip()}}\nA. {{choices[0]}}\nB. {{choices[1]}}\nC. {{choices[2]}}\nD. {{choices[3]}}\nAnswer:"
doc_to_choice:
  - A
  - B
  - C
  - D
doc_to_target: gold
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
