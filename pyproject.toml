[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "configs/train/generated",
  "configs/evaluation/generated",
  "LlamaFactory",
  "lm-evaluation-harness",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
